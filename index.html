<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerador de Senhas Seguras</title>
<style>
body {
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background-color: #f4f4f9;
}
.container {
    background-color: white;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 0 15px rgba(0,0,0,0.1);
    text-align: center;
    width: 300px;
}
input[type="number"], input[type="text"] {
    width: 100%;
    padding: 8px;
    margin: 10px 0;
    border-radius: 5px;
    border: 1px solid #ccc;
}
button {
    padding: 10px 15px;
    border: none;
    border-radius: 5px;
    background-color: #5c6bc0;
    color: white;
    cursor: pointer;
    margin-top: 10px;
}
button:hover {
    background-color: #3949ab;
}
.resultado {
    display: flex;
    margin-top: 10px;
}
.resultado input {
    flex: 1;
}
.resultado button {
    margin-left: 5px;
}
#avaliacaoSenha {
    margin-top: 15px;
    font-weight: bold;
}
</style>
</head>
<body>
<div class="container">
    <h1>Gerador de Senhas Seguras</h1>
    <label for="tamanhoSenha">Tamanho da senha:</label>
    <input type="number" id="tamanhoSenha" min="4" max="32" value="12">
    <button id="gerarSenha">Gerar Senha</button>
    <div class="resultado">
        <input type="text" id="senhaGerada" readonly>
        <button id="copiarSenha">Copiar</button>
    </div>
    <div id="avaliacaoSenha"></div>
</div>
<script>
const gerarBtn = document.getElementById("gerarSenha");
const senhaOutput = document.getElementById("senhaGerada");
const copiarBtn = document.getElementById("copiarSenha");
const tamanhoSenha = document.getElementById("tamanhoSenha");
const avaliacao = document.getElementById("avaliacaoSenha");

function gerarSenha(tamanho) {
    const caracteres = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+[]{}|;:,.<>?";
    let senha = "";
    for (let i = 0; i < tamanho; i++) {
        senha += caracteres.charAt(Math.floor(Math.random() * caracteres.length));
    }
    return senha;
}

function avaliarSenha(senha) {
    let score = 0;
    if (senha.length >= 8) score++;
    if (/[A-Z]/.test(senha)) score++;
    if (/[a-z]/.test(senha)) score++;
    if (/[0-9]/.test(senha)) score++;
    if (/[\!\@\#\$\%\^\&\*\(\)\_\+\[\]\{\}\|\;\:\,\.<>?]/.test(senha)) score++;
    switch(score) {
        case 5: return "Muito Forte 💪";
        case 4: return "Forte 👍";
        case 3: return "Média ⚖️";
        case 2: return "Fraca 😬";
        default: return "Muito Fraca 🚨";
    }
}

gerarBtn.addEventListener("click", () => {
    const senha = gerarSenha(parseInt(tamanhoSenha.value));
    senhaOutput.value = senha;
    avaliacao.textContent = avaliarSenha(senha);
});

copiarBtn.addEventListener("click", () => {
    senhaOutput.select();
    senhaOutput.setSelectionRange(0, 99999);
    document.execCommand("copy");
    alert("Senha copiada para a área de transferência!");
});
</script>
</body>
</html>
