<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Senhas Seguras</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Gerador de Senhas Seguras</h1>

        <label for="tamanhoSenha">Tamanho da senha:</label>
        <input type="number" id="tamanhoSenha" min="4" max="32" value="12">

        <button id="gerarSenha">Gerar Senha</button>

        <div class="resultado">
            <input type="text" id="senhaGerada" readonly>
            <button id="copiarSenha">Copiar</button>
        </div>

        <div id="avaliacaoSenha"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
